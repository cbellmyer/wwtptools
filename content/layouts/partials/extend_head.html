<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<meta name="theme-color" content="#0f172a">

{{- if or (eq .Layout "toolkit") (eq .Layout "matrix") (eq .Layout "reference") }}
{{- $toolkit := resources.Get "css/toolkit.css" | resources.Minify | fingerprint -}}
<link crossorigin="anonymous" href="{{ $toolkit.RelPermalink }}" integrity="{{ $toolkit.Data.Integrity }}" rel="preload stylesheet" as="style">
{{- end }}

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="preload" as="style" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet"></noscript>
<script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
            navigator.serviceWorker.register('{{ "sw.js" | relURL }}', { scope: '{{ "/" | relURL }}' }).catch(function (err) {
                console.warn('Service Worker registration failed:', err);
            });
        });
    }
</script>
