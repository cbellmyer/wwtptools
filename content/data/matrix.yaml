zones:
  - id: "activated-sludge"
    label: "Activated Sludge"
    code: "AS"
    description: "Aeration basin and secondary clarifier"
    symptoms:
      - id: "high-effluent-tss"
        label: "High Effluent TSS"
        description: "Suspended solids in secondary effluent above normal or permit limit"
        causes:
          - label: "Sludge Bulking (Filamentous)"
            indicators:
              - "SVI > 200 mL/g"
              - "Filamentous organisms visible under microscope"
              - "Sludge blanket depth increasing in secondary clarifier"
              - "Settleability test shows poor compaction at 30 minutes"
            response:
              - "Identify filamentous organism type — cause determines correct response"
              - "Check and adjust DO in aeration basin (target 1.5–3.0 mg/L)"
              - "Review SRT: long SRT favors Nocardia/Microthrix; low F/M favors Type 0041"
              - "See Filamentous Organisms reference table for organism-specific guidance"

          - label: "Denitrification Rising Sludge"
            indicators:
              - "Gas bubbles visible rising from sludge blanket in clarifier"
              - "Nitrate present in aeration basin effluent (> 1–2 mg/L)"
              - "SVI within normal range (< 150 mL/g)"
              - "Rising sludge occurs in patches or at regular intervals"
            response:
              - "Reduce sludge blanket depth by increasing WAS or RAS rate"
              - "Check for anoxic pockets in aeration basin — adjust mixing"
              - "Shorten sludge retention time in clarifier to reduce denitrification window"
              - "Review internal recycle rate if BNR process is in use"

          - label: "Hydraulic Overload"
            indicators:
              - "Influent flow above design or historical peak"
              - "SVI within normal range — not a bulking event"
              - "High TSS correlates with wet weather flow events"
              - "Sludge blanket rising during peak flow, recovering afterward"
            response:
              - "Increase RAS rate to maintain blanket depth in clarifier"
              - "Reduce WAS temporarily to maintain MLSS during high-flow period"
              - "Monitor effluent quality continuously; document event for permit records"
              - "Review wet weather operating plan; consider flow equalization if available"

          - label: "Deflocculation / Pin Floc"
            indicators:
              - "Effluent appears turbid with very small dispersed particles"
              - "SVI low or normal but settleometer shows diffuse, poorly structured floc"
              - "Recent process upset, chemical addition error, or industrial discharge event"
              - "Microscopy shows dispersed growth with few large floc particles"
            response:
              - "Check for toxic loading — review industrial discharge records"
              - "Review recent chemical additions for overdose or wrong product delivered"
              - "If SRT is very low, reduce wasting and allow biomass to recover"
              - "Consider polymer addition to clarifier feed as a temporary measure"

      - id: "foam-on-aeration-basin"
        label: "Foam on Aeration Basin"
        description: "Persistent or unusual foam accumulating on aeration basin surface"
        causes:
          - label: "Filamentous Foam (Nocardia / Microthrix)"
            indicators:
              - "Foam is brown, tan, or chocolate-mousse colored"
              - "Foam is stable and persistent — does not break down quickly"
              - "Nocardia or Microthrix parvicella identified under microscope"
              - "More prevalent at long SRT or with high fat/oil/grease loading"
            response:
              - "Reduce SRT by increasing WAS — this is the primary long-term control"
              - "Chlorinate foam using spray or injection; do not chlorinate the basin"
              - "Do not recycle foam back to the process — waste it from the surface"
              - "Identify and reduce upstream FOG loading if possible"

          - label: "Denitrification Foam"
            indicators:
              - "Foam is white or light gray and relatively transient"
              - "Foam appears near return lines, anoxic zones, or at low-flow periods"
              - "Nitrate present in system — denitrification is actively occurring"
              - "Foam breaks down within minutes when agitated"
            response:
              - "Adjust aeration to eliminate anoxic pockets in the aeration basin"
              - "Check for short-circuiting — ensure complete mixing in all zones"
              - "Review internal recycle rates if this is a BNR process"
              - "Not typically a compliance concern — monitor and document"

          - label: "Surfactant / Detergent Foam"
            indicators:
              - "Foam is bright white and dissipates quickly when disturbed"
              - "Onset correlates with a known industrial discharge or sewer cleaning event"
              - "No filamentous organisms identified under microscope"
              - "Foam may have a soapy or chemical odor"
            response:
              - "Identify and contact the discharger; verify pretreatment permit compliance"
              - "Increase aeration mixing to help break up surface foam"
              - "Foam typically resolves as the load passes through the system"
              - "File industrial pretreatment violation report if confirmed"

          - label: "Young Sludge / Low SRT"
            indicators:
              - "White foam occurring during startup or after aggressive WAS event"
              - "MLSS well below normal operating range"
              - "F/M ratio elevated — more food than biomass"
              - "No filamentous organisms; floc structure immature under microscope"
            response:
              - "Reduce or halt WAS until MLSS recovers to operating target"
              - "Reduce organic loading if possible during the recovery period"
              - "Foam resolves naturally as biomass and SRT increase — allow time"
              - "Do not add antifoam agents — they mask the symptom without fixing the cause"

      - id: "high-effluent-ammonia"
        label: "High Effluent Ammonia"
        description: "Effluent ammonia-N above permit limit or significantly above normal baseline"
        causes:
          - label: "Low DO in Aeration Basin"
            indicators:
              - "Measured DO in aeration basin consistently below 1.0 mg/L"
              - "Blowers running near or at maximum capacity"
              - "Ammonia rising correlates with low-DO periods in SCADA trend"
              - "DO deficit worsens with warm temperatures or high organic loading"
            response:
              - "Increase blower output or bring additional aeration capacity online"
              - "Check diffuser condition — fouled diffusers reduce oxygen transfer"
              - "Calculate actual oxygen demand vs. supply and identify the bottleneck"
              - "Reduce WAS temporarily to lower MLSS oxygen demand if that is the constraint"

          - label: "Low SRT / Biomass Washout"
            indicators:
              - "MCRT below the minimum for nitrification at current water temperature"
              - "Recent aggressive WAS event or process upset significantly reduced MLSS"
              - "MLSS and MLVSS trending below normal operating range"
              - "Nitrifier population recovery takes weeks, not days"
            response:
              - "Reduce WAS rate immediately — protect remaining nitrifying biomass"
              - "Increase SRT above minimum nitrification threshold for current temperature"
              - "Allow 2–4 weeks for nitrifier population to rebuild"
              - "Notify regulatory agency if a permit exceedance is expected"

          - label: "Low Alkalinity / pH Inhibition"
            indicators:
              - "Alkalinity in aeration basin effluent below 50 mg/L as CaCO3"
              - "Basin pH dropping below 6.8"
              - "System has been fully nitrifying — alkalinity consumed by nitrifiers"
              - "Problem gradual and often seasonal (high-strength influent periods)"
            response:
              - "Begin alkalinity supplementation before pH drops below 6.8"
              - "Dose sodium bicarbonate, soda ash, or lime based on influent TKN loading"
              - "Target residual alkalinity above 80–100 mg/L in basin effluent"
              - "See Alkalinity reference table for supplement chemical properties and dosing factors"

          - label: "Toxic Inhibition"
            indicators:
              - "Sudden onset not explained by SRT, DO, or alkalinity changes"
              - "Correlates with a known or suspected industrial discharge event"
              - "DO may be adequate but nitrification stops abruptly"
              - "BOD removal may also be affected if toxicant is broad-spectrum"
            response:
              - "Check industrial discharge records and contact the pretreatment program"
              - "Collect influent and basin samples for toxicity characterization"
              - "Increase WAS temporarily to flush inhibited biomass and allow recovery"
              - "Document thoroughly for regulatory reporting and industrial enforcement"

      - id: "ph-dropping"
        label: "pH Dropping in Basin"
        description: "Aeration basin pH trending downward from normal operating range"
        causes:
          - label: "Nitrification Consuming Alkalinity"
            indicators:
              - "Alkalinity in aeration basin effluent below 80 mg/L as CaCO3"
              - "pH trending down gradually over days to weeks"
              - "Full or partial nitrification occurring — effluent ammonia is low"
              - "Seasonal pattern — often worsens as influent ammonia load increases"
            response:
              - "Begin alkalinity supplementation before pH drops below 6.8"
              - "Calculate supplement dose based on influent TKN and 7.14 mg alk consumed per mg NH4-N nitrified"
              - "Target residual alkalinity above 80–100 mg/L in basin effluent"
              - "Monitor pH and alkalinity daily until supplementation stabilizes the system"

          - label: "Industrial Acid Discharge"
            indicators:
              - "Sudden rapid pH drop — occurs over hours rather than days"
              - "Low influent pH or elevated influent conductivity at time of event"
              - "Correlates with known industrial process schedule or discharge timing"
              - "Process parameters were normal before the event"
            response:
              - "Increase influent pH monitoring frequency during the event"
              - "Contact industrial pretreatment program immediately"
              - "Add caustic or lime to stabilize basin pH if rapid drop threatens the process"
              - "File pretreatment violation or process upset report with permit authority"

          - label: "Inadequate Aeration / CO2 Accumulation"
            indicators:
              - "DO is low in the basin (below 1.0 mg/L)"
              - "pH drop is mild and correlates with low-aeration periods"
              - "CO2 produced by respiration not being stripped from mixed liquor"
              - "pH recovers when aeration rate increases"
            response:
              - "Increase aeration to strip CO2 and restore DO above 1.5 mg/L"
              - "Check for diffuser fouling or blower issues limiting aeration capacity"
              - "Review overnight aeration control settings — ensure adequate minimum mixing"

      - id: "rising-sludge-blanket"
        label: "Rising Sludge Blanket"
        description: "Sludge blanket depth increasing in secondary clarifier above normal range"
        causes:
          - label: "Denitrification Gas Lift"
            indicators:
              - "Gas bubbles visible rising from blanket surface in clarifier"
              - "Sludge rises in patches or rafts — not a uniform blanket rise"
              - "Nitrate present in system (above 1–2 mg/L)"
              - "More common in warmer conditions or during low-flow periods"
            response:
              - "Increase RAS rate to reduce sludge residence time in clarifier"
              - "Check for anoxic zones in aeration basin — adjust mixing or aeration distribution"
              - "Reduce WAS to lower overall blanket depth while maintaining MLSS"
              - "Review BNR zone boundaries and internal recycle rates if applicable"

          - label: "Hydraulic Overload"
            indicators:
              - "Influent flow above design or historical peak capacity"
              - "Blanket rises proportionally with flow — no gas bubbles visible"
              - "SVI within normal range — not a settleability issue"
              - "Blanket recovers to normal depth as flow recedes"
            response:
              - "Increase RAS rate to maintain blanket depth during the high-flow event"
              - "Reduce WAS temporarily if MLSS target allows"
              - "Monitor effluent quality continuously and prepare permit documentation"
              - "Review wet weather operating plan and flow equalization options"

          - label: "RAS Rate Too Low"
            indicators:
              - "Blanket rising slowly over hours to days without flow event or gas bubbles"
              - "RAS rate recently reduced or pump operating at reduced speed"
              - "WAS rate recently increased without a corresponding RAS adjustment"
              - "No filamentous bulking — SVI within normal range"
            response:
              - "Increase RAS rate — verify RAS pump is operating correctly"
              - "Recalculate RAS rate based on current MLSS and desired blanket depth"
              - "Check RAS return line for obstruction, closed valve, or pump failure"
              - "Monitor blanket depth hourly after adjusting RAS"

          - label: "Poor Sludge Settleability (Bulking)"
            indicators:
              - "SVI above 200 mL/g — sludge not compacting normally"
              - "Settleometer shows diffuse blanket and poor compaction"
              - "Filamentous organisms identified under microscope"
              - "Blanket remains elevated even when RAS is increased"
            response:
              - "Address the underlying filamentous bulking cause (see High Effluent TSS diagnostic)"
              - "Increase RAS rate to compensate for reduced settling rate"
              - "Lower target MLSS temporarily to reduce solids loading on the clarifier"

      - id: "low-do-adequate-blowers"
        label: "Low DO Despite Blowers Running"
        description: "Dissolved oxygen in aeration basin below target with blowers at or near full output"
        causes:
          - label: "High Organic Loading"
            indicators:
              - "Influent BOD or COD elevated above normal — confirm with sampling"
              - "Low DO correlates with high-flow or high-strength discharge periods"
              - "Blowers at or near maximum rated output"
              - "Effluent BOD may also be elevated"
            response:
              - "Collect influent grab samples to confirm and quantify the loading event"
              - "Contact industrial discharger if high-strength load is identified"
              - "Reduce WAS temporarily to lower MLSS and distributed oxygen demand"
              - "Review DO control strategy — manual override or higher setpoint may be needed"

          - label: "Diffuser Fouling"
            indicators:
              - "Uneven or reduced bubble distribution observed in basin"
              - "Blower discharge pressure elevated compared to clean baseline"
              - "Oxygen transfer efficiency declining — more air required for same DO"
              - "Problem develops gradually over weeks to months"
            response:
              - "Schedule diffuser cleaning — acid clean or mechanical cleaning per manufacturer"
              - "Perform air distribution check to identify zones with reduced output"
              - "Increase blower output as a temporary measure while planning maintenance"
              - "Review diffuser cleaning schedule and increase frequency if needed"

          - label: "Elevated MLSS / Excess Biomass"
            indicators:
              - "MLSS above normal operating range or trending upward for weeks"
              - "WAS rate recently reduced or not keeping pace with biological growth"
              - "Oxygen uptake rate elevated throughout the basin"
              - "DO improves progressively as MLSS is reduced by wasting"
            response:
              - "Increase WAS rate to bring MLSS back to target operating range"
              - "Recalculate SRT and F/M — confirm the MLSS target is correct for current loading"
              - "Monitor DO recovery over days to weeks as MLSS decreases"

          - label: "High Nitrification Demand"
            indicators:
              - "High influent TKN or ammonia-N concentration"
              - "Full nitrification occurring — effluent ammonia near zero, but O2 demand is high"
              - "DO deficit most severe in first aeration zone where ammonia is highest"
              - "Nitrification consumes 4.57 lb O2 per lb NH4-N oxidized"
            response:
              - "Calculate total nitrification oxygen demand vs. installed aeration capacity"
              - "Consider staged DO control — allow partial nitrification in first zone"
              - "Evaluate whether additional aeration capacity is needed for design conditions"
              - "Check blower performance data against rated capacity and current conditions"
