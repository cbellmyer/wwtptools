ci:
  collect:
    staticDistDir: content/public
    url:
      - http://localhost/
      - http://localhost/calculators/
      - http://localhost/reference/
      - http://localhost/guides/
      - http://localhost/matrix/
      - http://localhost/about/
    numberOfRuns: 1
  assert:
    preset: lighthouse:no-pwa
    assertions:
      categories:performance:
        - warn
        - minScore: 0.8
      categories:accessibility:
        - error
        - minScore: 0.9
      categories:best-practices:
        - warn
        - minScore: 0.85
      categories:seo:
        - warn
        - minScore: 0.9
      geolocation-on-start: "off"
      network-dependency-tree-insight: "off"
      cls-culprits-insight: "off"
      errors-in-console: warn
      # The site uses a single shared CSS bundle (wwtptools.css) that contains
      # page-specific styles for all layouts. Toolkit-only CSS is loaded
      # conditionally, but the base bundle will always have some unused rules
      # per page. maxLength: 1 enforces the current architecture without
      # allowing the count to grow.
      unused-css-rules:
        - error
        - maxLength: 1
